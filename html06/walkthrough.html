<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Viewport tag: explained in Step 11 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html07 Walkthrough</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        main {
            max-width: 60rem;
            /* page stops growing at 960px */
            margin: 0 auto;
            /* center it */
            padding: 1rem;
        }

        .cards {
            display: flex;
            justify-content: ;
        }

        .center-box {
            display: flex;
            justify-content: center;
            /* center left to right */
            align-items: center;
            /* center top to bottom */
            height: 10rem;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #2c3e50;
        }

        .logo {
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }


        .nav-links a {
            color: #fff;
            text-decoration: none;
        }


        .cards {
            display: flex;
            gap: 1.5rem;
        }

        .card {
            flex: 1;
            /* every card grows by the same amount = equal widths */
            background-color: #fff;
            padding: 1.5rem;
            border: 2px solid #2c3e50;
            border-radius: 8px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            /* extra items move to the next line */
            gap: 1rem;
        }

        .gallery img {
            flex: 1;
            /* grow to fill the row */
            min-width: 12rem;
            /* but never get skinnier than 12rem, so they wrap instead */
        }

        img {
            max-width: 100%;
            /* never wider than the box it is in */
            height: auto;
            /* keep the picture's shape (no stretching) */
            display: block;
            /* remove the small gap under the image */
        }

        <
        /* Your walkthrough CSS goes below this line */
    </style>
</head>


<body>
    <!-- Nav bar: two flex items (the logo and the links group) -->
    <nav class="navbar">
        <div class="logo">My Site</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <main>
        <h1>Flexbox Practice</h1>

        <!-- Three cards: will sit in a row -->
        <div class="cards">
            <div class="card">
                <h2>Fast</h2>
                <p>Loads quickly on any device.</p>
            </div>
            <div class="card">
                <h2>Clean</h2>
                <p>Easy to read and easy to use.</p>
            </div>
            <div class="card">
                <h2>Responsive</h2>
                <p>Works on phones, tablets, and desktops.</p>
            </div>
        </div>

        <!-- Six photos: will wrap onto more than one row -->
        <div class="gallery">
            <img src="images/photo-1.png" alt="Sample photo 1">
            <img src="images/photo-2.png" alt="Sample photo 2">
            <img src="images/photo-3.png" alt="Sample photo 3">
            <img src="images/photo-4.png" alt="Sample photo 4">
            <img src="images/photo-5.png" alt="Sample photo 5">
            <img src="images/photo-6.png" alt="Sample photo 6">
        </div>
    </main>
</body>

</html>
