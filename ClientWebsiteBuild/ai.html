<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe Grid Layout</title>
  <link rel="stylesheet" href="ai.css">
</head>
<body>

  <div class="page-container">

    <!-- Section 1#: Navigation Bar -->
    <nav class="navbar-grid">
      <button class="nav-button">NAV</button>
      <button class="nav-button">About</button>
      <button class="nav-button">Gallet</button>
      <button class="nav-button">Shop</button>
      <button class="nav-button">Slogy</button>
      <button class="nav-button">6#</button>
    </nav>

    <!-- Section 7#: Hero Section -->
    <section class="hero-grid">
      <div class="video-box">Hero Video / Content</div>
      <button class="hero-cta-button">Explore Now</button>
    </section>

    <!-- Section 8#: Top Seller Section -->
    <section class="top-seller-grid">
      <h2 class="section-title">Top Seller</h2>
      <div class="cards-container">
        <button class="card">9#</button>
        <button class="card">10#</button>
        <button class="card">11#</button>
        <button class="card">Saying</button>
      </div>
    </section>

    <!-- Section 13#: Discounts Section -->
    <section class="discounts-grid">
      <div class="discounts-left">
        <h2 class="section-title">Discounts</h2>
        <div class="cards-container">
          <button class="card">14#</button>
          <button class="card">75#</button>
          <button class="card">16#</button>
        </div>
      </div>
      <div class="semi-uni-box">
        <p>semi-uni<br>multi color<br>background</p>
      </div>
    </section>

    <!-- Section 17#: Footer -->
    <footer class="footer-grid">
      footer
    </footer>

  </div>

</body>
</html>
