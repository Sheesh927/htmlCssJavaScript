<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe Grid Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page-container">

    <!-- Section 1#: Navigation Bar -->
    <nav class="navbar-grid">
      <div class="nav-item">NAV</div>
      <div class="nav-item">About</div>
      <div class="nav-item">Gallet</div>
      <div class="nav-item">Shop</div>
      <div class="nav-item">Slogy</div>
      <div class="nav-item">6#</div>
    </nav>

    <!-- Section 7#: Hero Section -->
    <section class="hero-grid">
      <div class="carson-box">
        <h1>CARSON</h1>
      </div>
      <div class="video-box">
        <span>Video</span>
      </div>
    </section>

    <!-- Section 8#: Top Seller Section -->
    <section class="top-seller-grid">
      <h2 class="section-title">top sellar</h2>
      <div class="cards-container">
        <div class="card">9#</div>
        <div class="card">10#</div>
        <div class="card">11#</div>
        <div class="card">Saying</div>
      </div>
    </section>

    <!-- Section 13#: Discounts Section -->
    <section class="discounts-grid">
      <div class="discounts-left">
        <h2 class="section-title">Discounts</h2>
        <div class="cards-container">
          <div class="card">14#</div>
          <div class="card">75#</div>
          <div class="card">16#</div>
        </div>
      </div>
      <div class="semi-uni-box">
        <p>semi-uni<br>molti color<br>background</p>
      </div>
    </section>

    <!-- Section 17#: Footer -->
    <footer class="footer-grid">
      footer
    </footer>

  </div>

</body>
</html>
