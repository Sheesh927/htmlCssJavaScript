<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
table, th, td { border: 4px solid #4052f3; border-collapse: collapse;}
th, td {padding: 8px}
th { background-color:hotpink}
</style>

</head>
<body>  
<h1>Lunch Menu</h1>
<table>
    <caption>Weekly Lunch Menu</caption>
    <tr>
        <th>Day</th>
        <th>Main</th>
        <th>Side</th>
    </tr>
    <tr>
        <td>Monday</td>
        <td>Pizza</td>
        <td>Salad</td>
    </tr>
    <tr>
        <td>Tuesday</td>
        <td>Tacos</td>
        <td>Rice</td>
    </tr>
    <tr>
        <td>Wednesday</td>
        <td>Cicken Alfredo</td>
        <td>Soup</td>
    </tr>
    <tr>
        <td>Thursday</td>
        <td>Bosco Sticks</td>
        <td>French Fries</td>
    </tr>
    <tr>
        <td>Friday</td>
        <td colspan="2">No School - Holiday</td>
        
    </tr>
</table>
</body>
</html>
